<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  
  <!-- Service Worker DISABLED - Unregistering any existing service workers -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          // Unregister all service workers
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
            console.log('🧹 Service Worker unregistered:', registration.scope);
          }
          
          // Clear all caches
          const cacheNames = await caches.keys();
          for (let name of cacheNames) {
            await caches.delete(name);
            console.log('🧹 Cache deleted:', name);
          }
          
          if (registrations.length > 0 || cacheNames.length > 0) {
            console.log('✅ All service workers and caches cleared');
          }
        } catch (error) {
          console.error('❌ Error clearing service workers/caches:', error);
        }
      });
    }
  </script>
